name: 🐛 Bug Report
description: Report a bug to help improve Auto CutSmart.
title: "[BUG] <brief description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        To help me resolve this issue quickly, please provide the details below.

  - type: dropdown
    id: component-environment
    attributes:
      label: 🗂️ Component Affected
      description: |
        When did the issue occur? Which part of the add-on is the issue related to?
        **When I was using the:**
      options:
        - Camera Splitting (The main 'Split Animation of Camera' functions)
        - Custom Rendering (The 'Auto CutSmart - Render Tool')
        - Other (General preferences, installation, etc.)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Describe the Bug
      description: What happened? Please provide a clear and concise description of the bug.
      placeholder: |
        Example: When I click 'Split Animation', Blender crashes on Stage 5.
    validations:
      required: true

  - type: input
    id: blender-version
    attributes:
      label: 🧱 Blender Version
      description: The exact version of Blender you are using (e.g., 4.1.0 or 3.6 LTS).
      placeholder: e.g., 4.1.0
    validations:
      required: true

  - type: input
    id: addon-version
    attributes:
      label: 📦 Add-on Version
      description: The version number of Auto CutSmart you have installed.
      placeholder: e.g., 1.5.2
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 💻 Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other (Please specify in "Additional Context")
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## Reproducing the Bug

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide the **exact steps** to reproduce the bug.
        1. ...
        2. ...
        3. ...
      placeholder: |
        1. Open the attached Blender file.
        2. Select the "Camera" object.
        3. Click the 'Split Animation' button.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 🎯 Expected Behavior
      description: What did you expect to happen instead of the bug?
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 🔗 Reproduction File and Diagnostic Log

  - type: input
    id: blend_link
    attributes:
      label: Blender File Link (Required for Reproduction)
      description: Provide a link to a minimal Blender file that reproduces the issue (e.g., Google Drive, Dropbox, GitHub).
      placeholder: https://drive.google.com/file/d/LinkID/view?usp=drive_link

  - type: textarea
    id: diagnostic-log
    attributes:
      label: 📋 Diagnostic Log File (Required for Crashes/Critical Errors)
      description: |
        If the add-on crashed or presented an unexpected error:
        1. Go to the Add-on Preferences and enable **FATAL Error Reporting**.
        2. Run the operation again. When the crash window appears, choose to save the diagnostic log file (`.log`) to your computer.
        3. **Drag and drop the saved `.log` file into this text area to attach it to the issue.**

  - type: textarea
    id: additional-context
    attributes:
      label: 🗒️ Additional Context or Notes
      description: Add any other final notes here.
